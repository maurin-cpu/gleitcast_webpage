<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 680" role="img" aria-label="Schéma : un parapente de 10 mètres d'envergure est placé au travers d'un cœur de tourbillon. À gauche l'air court à 34 km/h dans un sens, à droite dans l'autre — 69 km/h de différence sur l'envergure.">
<rect width="780" height="680" fill="#FFFFFF"/>
<defs>
<linearGradient id="schirm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#075985"/><stop offset="0.5" stop-color="#0369A1"/><stop offset="1" stop-color="#075985"/></linearGradient>
<linearGradient id="trichter" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#B45309" stop-opacity="0.45"/><stop offset="0.55" stop-color="#B45309" stop-opacity="0.22"/><stop offset="1" stop-color="#B45309" stop-opacity="0.08"/></linearGradient>
<style>
    /* Standbild-Regel (12.08.2026): keine Aussage in einer Animation liegen
       lassen — als Bild eingebunden bleibt ein SVG bei Frame 0 stehen.
       Frame 0 zeigt deshalb immer die fertige Grafik, Schleifen sind Zugabe. */
    .flimmer { animation: flimmern 2.4s ease-in-out infinite; }
    @keyframes flimmern { 0%,100%{transform:translateY(0);opacity:.55}
                          50%{transform:translateY(-8px);opacity:.9} }
    .staub { animation: staubt 2.8s ease-in-out infinite; }
    @keyframes staubt { 0%,100%{transform:translate(0,0);opacity:.6}
                        50%{transform:translate(10px,-22px);opacity:.9} }
    .zustrom { animation: zieht 2.2s ease-in-out infinite; }
    @keyframes zieht { 0%,100%{opacity:1} 50%{opacity:.55} }
    /* Blase steigt sichtbar (User-Feedback 17.08.2026: Feld 2 war statisch).
       Frame 0 = Endlage, die Schleife ist Zugabe. */
    .steigt { animation: steigen 3.2s ease-in-out infinite; }
    @keyframes steigen { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-13px)} }
    /* Feld 4: die Streckung selbst — unten verankert, zieht sich hoch
       (User-Feedback 17.08.2026, 2. Runde). Läuft als kleiner Endlos-Loop
       durch; freigegeben wird er von der Master-Sequenz (siehe
       abb_entstehung). */
    .streckt { animation: strecken 4.2s ease-in-out infinite; }
    @keyframes strecken {
      0%,100% { transform: scale(1,1) }
      45%     { transform: scale(1.07,0.84) }
      62%     { transform: scale(0.99,1.015) }
    }
    @media (prefers-reduced-motion: reduce) {
      .flimmer, .staub, .zustrom, .steigt, .streckt { animation: none !important; }
      .teilchen { visibility: hidden; }
    }
  </style>
</defs>
