<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" role="img" aria-label="Coupe animée en cinq étapes, répétée en boucle : un cumulonimbus grandit, la pluie tombe et s'évapore, au sol s'accumule une couche plate d'air froid qui s'échappe vers la droite et y arrive en rafales.">
  <style>
    /* Sequenz wie im Remotion-Reel (storm→cooling→bubble→push→wind), als ENDLOS-
       SCHLEIFE: 16-s-Master-Zyklus, alle Auftritte als Keyframe-Prozente derselben
       Dauer — dadurch resetten alle Elemente exakt gleichzeitig und die Geschichte
       beginnt von vorn. 1 s = 6,25 %.
         ~0–2,2 s  (0–13,5 %)   Schritt 1: Wolke entsteht, dann Blitz (ab 2,6 s)
         ~3 s      (18,75 %)    Schritt 2: Regen setzt ein
         ~5,5–7,75 s (34–48 %)  Schritt 3: Kaltluft sammelt sich unter der Wolke
         ~8,4–10,5 s (52–66 %)  Schritt 4: Schicht quillt nach rechts hinaus
         ~11 s     (69 %)       Schritt 5: Böen-Pfeile aus der Vorderkante
         bis ~15,4 s (96,5 %)   fertiges Bild steht, dann kurzer Fade → von vorn.
       Die kleinen Endlos-Loops (Regen, Blitz-Flackern, Strömung, Böen) laufen ab
       t=0 mit negativen Delays durch und werden von ihren Gruppen freigegeben.
       Reduced motion: Sequenz aus (= fertiges Bild), Loops pausiert als Standbild. */

    @keyframes rainfall {
      0%   { transform: translateY(0);    opacity: 0; }
      12%  { opacity: .8; }
      72%  { opacity: .68; }
      100% { transform: translateY(92px); opacity: 0; }
    }
    @keyframes flashK {
      0%, 2.5%   { opacity: .95; }
      4%         { opacity: 0; }
      6%, 8%     { opacity: .9; }
      9.5%, 100% { opacity: 0; }
    }
    @keyframes gustK {
      0%   { transform: translateX(-42px); opacity: 0; }
      16%  { opacity: 1; }
      68%  { opacity: 1; }
      100% { transform: translateX(92px);  opacity: 0; }
    }
    @keyframes flowK { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -120px; } }
    @keyframes driftK { from { transform: translateX(0); } to { transform: translateX(-70px); } }

    .rain  { animation: rainfall 1.5s linear infinite; }
    .flash { animation: flashK 6s linear infinite; animation-delay: -.48s; }
    .gust  { animation: gustK 2.6s linear infinite; }
    .flow  { animation: flowK 1.8s linear infinite; }
    .cloud { animation: driftK 16s ease-in-out infinite alternate; }

    /* Master-Sequenz: gleiche Dauer für alle ⇒ gemeinsamer Neustart */
    .seq {
      animation-duration: 16s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
    }
    .kA,.kB,.kC,.kD,.kE,.kF,.m1,.m2,.m3,.m4,.m5 { transform-box: fill-box; transform-origin: center; }

    /* Wolken-Aufbau (Schritt 1) */
    @keyframes kA { 0%,1%    { transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); } 4%,100%    { transform: scale(1); } }
    @keyframes kB { 0%,3.5%  { transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); } 6.5%,100%  { transform: scale(1); } }
    @keyframes kC { 0%,5.5%  { transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); } 8.5%,100%  { transform: scale(1); } }
    @keyframes kD { 0%,7%    { transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); } 10%,100%   { transform: scale(1); } }
    @keyframes kE { 0%,8.4%  { transform: scaleX(.12); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); } 11.5%,100% { transform: scaleX(1); opacity: 1; } }
    @keyframes kF { 0%,10.3% { transform: scaleX(.12); opacity: 0; animation-timing-function: cubic-bezier(.22,1,.36,1); } 13.5%,100% { transform: scaleX(1); opacity: 1; } }
    .kA { animation-name: kA; } .kB { animation-name: kB; } .kC { animation-name: kC; }
    .kD { animation-name: kD; } .kE { animation-name: kE; } .kF { animation-name: kF; }

    /* Einblendungen (Wulst-Linien, Wölkchen, Gruppen-Freigaben, Label) */
    @keyframes f1     { 0%,2.2%   { opacity: 0; } 5%,100%    { opacity: 1; } }
    @keyframes f2     { 0%,5%     { opacity: 0; } 8%,100%    { opacity: 1; } }
    @keyframes f3     { 0%,7.6%   { opacity: 0; } 10.5%,100% { opacity: 1; } }
    @keyframes f4     { 0%,9.7%   { opacity: 0; } 12.5%,100% { opacity: 1; } }
    @keyframes gFlash { 0%,16.25% { opacity: 0; } 18%,100%   { opacity: 1; } }
    @keyframes gRain  { 0%,18.75% { opacity: 0; } 22.5%,100% { opacity: 1; } }
    @keyframes gFlow  { 0%,40.6%  { opacity: 0; } 44%,100%   { opacity: 1; } }
    @keyframes gGust  { 0%,68.75% { opacity: 0; } 72%,100%   { opacity: 1; } }
    @keyframes gLabel { 0%,72.5%  { opacity: 0; } 76%,100%   { opacity: 1; } }
    .f1 { animation-name: f1; } .f2 { animation-name: f2; } .f3 { animation-name: f3; } .f4 { animation-name: f4; }
    .gFlash { animation-name: gFlash; } .gRain { animation-name: gRain; } .gFlow { animation-name: gFlow; }
    .gGust { animation-name: gGust; } .gLabel { animation-name: gLabel; }

    /* Schritt-Nummern */
    @keyframes m1 { 0%,2.5%  { transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); } 5.5%,100%  { transform: scale(1); } }
    @keyframes m2 { 0%,20%   { transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); } 23%,100%   { transform: scale(1); } }
    @keyframes m3 { 0%,45.6% { transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); } 48.5%,100% { transform: scale(1); } }
    @keyframes m4 { 0%,64.4% { transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); } 67.5%,100% { transform: scale(1); } }
    @keyframes m5 { 0%,70.6% { transform: scale(0); animation-timing-function: cubic-bezier(.22,1,.36,1); } 73.5%,100% { transform: scale(1); } }
    .m1 { animation-name: m1; } .m2 { animation-name: m2; } .m3 { animation-name: m3; }
    .m4 { animation-name: m4; } .m5 { animation-name: m5; }

    /* Kaltluft: sammeln (Schritt 3), innehalten, hinausquellen (Schritt 4) */
    @keyframes growK {
      0%,34.4% { transform: scaleX(0);   animation-timing-function: cubic-bezier(.3,.6,.3,1); }
      48.4%    { transform: scaleX(.55); }
      52.5%    { transform: scaleX(.55); animation-timing-function: cubic-bezier(.3,.6,.3,1); }
      65.6%,100% { transform: scaleX(1); }
    }
    .grw { animation-name: growK; transform-origin: 330px 690px; }

    /* Gesamtszene: kurzer Fade am Zyklusende kaschiert den Neustart */
    @keyframes gScene { 0% { opacity: 0; } 1.5%,96.5% { opacity: 1; } 100% { opacity: 0; } }
    .gScene { animation-name: gScene; }

    @media (prefers-reduced-motion: reduce) {
      .seq { animation: none !important; }
      .rain, .flash, .gust, .flow, .cloud { animation-play-state: paused !important; }
    }
  </style>

  <defs>
    <linearGradient id="gwSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCEEFB"/><stop offset="100%" stop-color="#F2F8FE"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="690" fill="url(#gwSky)"/>
  <g opacity=".4" fill="#FFFFFF">
    <g class="cloud"><ellipse cx="1420" cy="84" rx="125" ry="28"/></g>
    <g class="cloud" style="animation-duration:22s;animation-delay:-8s"><ellipse cx="1760" cy="148" rx="92" ry="22"/></g>
  </g>
  <rect x="0" y="690" width="1920" height="30" fill="#DCE4EC"/>
  <line x1="0" y1="690" x2="1920" y2="690" stroke="#64748B" stroke-width="4"/>

  <!-- alles Erzählte hängt an der 16-s-Master-Schleife -->
  <g class="seq gScene">

    <!-- SCHRITT 1 · Cumulonimbus entsteht — Geometrie 1:1 aus GustWaveScene.tsx -->
    <g transform="translate(570 474) scale(1.05) translate(-570 -474)">
      <ellipse class="seq kA" cx="570" cy="452" rx="140" ry="26" fill="#71879D"/>
      <g fill="#AEBDCB">
        <circle class="seq kA" cx="570" cy="445" r="60"/>
        <circle class="seq kA" cx="538" cy="415" r="64"/>
        <circle class="seq kA" cx="605" cy="410" r="62"/>
        <circle class="seq kB" cx="522" cy="352" r="56"/>
        <circle class="seq kB" cx="614" cy="345" r="56"/>
        <circle class="seq kB" cx="568" cy="330" r="70"/>
        <circle class="seq kC" cx="532" cy="272" r="62"/>
        <circle class="seq kC" cx="602" cy="262" r="64"/>
        <circle class="seq kD" cx="542" cy="205" r="58"/>
        <circle class="seq kD" cx="598" cy="198" r="60"/>
      </g>
      <g fill="#C2CEDA" opacity=".9">
        <circle class="seq kB" cx="550" cy="360" r="42"/>
        <circle class="seq kC" cx="542" cy="250" r="40"/>
      </g>
      <g fill="none" stroke="#8FA3B6" stroke-width="4.5" stroke-linecap="round" opacity=".5">
        <path class="seq f1" d="M 522 442 Q 570 420 620 440"/>
        <path class="seq f2" d="M 520 372 Q 568 350 618 370"/>
        <path class="seq f2" d="M 502 300 Q 534 282 566 300"/>
        <path class="seq f2" d="M 577 292 Q 606 276 634 294"/>
        <path class="seq f3" d="M 508 232 Q 542 214 576 231"/>
        <path class="seq f3" d="M 578 222 Q 606 206 632 224"/>
        <path class="seq f4" d="M 490 158 Q 570 176 652 158"/>
        <path class="seq f4" d="M 440 122 Q 570 142 702 122"/>
      </g>
      <!-- der Turm erreicht die Sperrschicht: Zwischenstufen, dann der Teller -->
      <g class="seq kE"><ellipse cx="570" cy="168" rx="128" ry="34" fill="#AEBDCB"/></g>
      <g class="seq kE"><ellipse cx="570" cy="138" rx="196" ry="32" fill="#AEBDCB"/></g>
      <g class="seq kF">
        <path d="M 315 100 C 315 80 340 72 380 72 L 760 72 C 802 72 825 82 825 102 C 825 122 800 130 760 130 L 380 130 C 340 130 315 120 315 100 Z" fill="#AEBDCB"/>
        <ellipse cx="480" cy="96" rx="92" ry="16" fill="#C2CEDA" opacity=".9"/>
      </g>
      <!-- Begleitwölkchen -->
      <g class="seq f2"><g fill="#C7D2DE" opacity=".9">
        <circle cx="280" cy="524" r="18"/><circle cx="308" cy="520" r="24"/><circle cx="334" cy="525" r="16"/>
      </g></g>
      <g class="seq f3"><g fill="#C7D2DE" opacity=".9">
        <circle cx="798" cy="508" r="15"/><circle cx="822" cy="505" r="20"/><circle cx="845" cy="509" r="14"/>
      </g></g>
      <!-- Blitz — erst wenn die Wolke reif ist -->
      <g class="seq gFlash">
        <polygon class="flash" points="514,458 552,458 530,508 566,508 508,564 538,512 502,512" fill="#FDE047"/>
      </g>
    </g>

    <!-- SCHRITT 2 · Regen: fällt kontinuierlich, löst sich beim Verdunsten auf -->
    <g class="seq gRain" stroke="#60A5FA" stroke-width="5" stroke-linecap="round">
      <line class="rain" x1="437" y1="474" x2="432" y2="498" opacity=".78" style="animation-delay:-.15s;animation-duration:1.4s"/>
      <line class="rain" x1="461" y1="474" x2="456" y2="498" opacity=".45" style="animation-delay:-.95s;animation-duration:1.55s"/>
      <line class="rain" x1="485" y1="474" x2="480" y2="498" opacity=".72" style="animation-delay:-.45s;animation-duration:1.45s"/>
      <line class="rain" x1="509" y1="474" x2="504" y2="498" opacity=".28" style="animation-delay:-1.25s;animation-duration:1.6s"/>
      <line class="rain" x1="533" y1="474" x2="528" y2="498" opacity=".80" style="animation-delay:-.05s;animation-duration:1.35s"/>
      <line class="rain" x1="557" y1="474" x2="552" y2="498" opacity=".58" style="animation-delay:-.7s;animation-duration:1.5s"/>
      <line class="rain" x1="581" y1="474" x2="576" y2="498" opacity=".76" style="animation-delay:-.3s;animation-duration:1.42s"/>
      <line class="rain" x1="605" y1="474" x2="600" y2="498" opacity=".22" style="animation-delay:-1.4s;animation-duration:1.58s"/>
      <line class="rain" x1="629" y1="474" x2="624" y2="498" opacity=".68" style="animation-delay:-.55s;animation-duration:1.48s"/>
      <line class="rain" x1="653" y1="474" x2="648" y2="498" opacity=".38" style="animation-delay:-1.1s;animation-duration:1.52s"/>
      <line class="rain" x1="677" y1="474" x2="672" y2="498" opacity=".64" style="animation-delay:-.85s;animation-duration:1.44s"/>
      <line class="rain" x1="701" y1="474" x2="696" y2="498" opacity=".78" style="animation-delay:-.4s;animation-duration:1.38s"/>
    </g>

    <!-- SCHRITT 3 + 4 · Kaltluft sammelt sich (linke Kante fix) und quillt nach
         rechts hinaus — layerPath(810, 480, 100) aus GustWaveScene -->
    <g class="seq grw">
      <path d="M 330 690 C 330 616 454.8 590 646.8 590 L 1069.2 590 C 1222.8 590 1270.8 622 1270.8 690 Z"
            fill="#3B82F6" opacity=".42"/>
      <path d="M 330 690 C 330 616 454.8 590 646.8 590 L 1069.2 590 C 1222.8 590 1270.8 622 1270.8 690"
            fill="none" stroke="#1D4ED8" stroke-width="6"/>
      <!-- in der Schicht fliesst die Luft sichtbar zur Nase -->
      <g class="seq gFlow"><g fill="none" stroke="#1D4ED8" stroke-linecap="round" opacity=".32" stroke-dasharray="26 34">
        <path class="flow" d="M 375 622 C 500 610 700 608 900 610 C 1060 612 1180 624 1240 646" stroke-width="7"/>
        <path class="flow" d="M 360 652 C 520 644 760 642 980 644 C 1120 646 1210 656 1252 668" stroke-width="6" style="animation-delay:-.6s;animation-duration:1.65s"/>
        <path class="flow" d="M 350 678 C 560 674 840 673 1080 675 C 1180 676 1240 679 1262 682" stroke-width="5" style="animation-delay:-1.1s;animation-duration:1.95s"/>
      </g></g>
    </g>

    <!-- SCHRITT 5 · Böen schiessen als Pfeile aus der Vorderkante -->
    <g class="seq gGust" stroke-linecap="round">
      <g class="gust" style="animation-delay:-.5s">
        <line x1="1262" y1="652" x2="1512" y2="650" stroke="#DC2626" stroke-width="13"/>
        <polygon points="1546,650 1508,636 1508,664" fill="#DC2626"/>
      </g>
      <g class="gust" style="animation-delay:-1.1s">
        <line x1="1227" y1="596" x2="1442" y2="594" stroke="#DC2626" stroke-width="11"/>
        <polygon points="1474,594 1439,582 1439,606" fill="#DC2626"/>
      </g>
      <g class="gust" style="animation-delay:-1.7s">
        <line x1="1377" y1="542" x2="1557" y2="540" stroke="#F87171" stroke-width="9"/>
        <polygon points="1588,540 1555,529 1555,551" fill="#F87171"/>
      </g>
      <g class="gust" style="animation-delay:-2.3s">
        <line x1="1250" y1="487" x2="1400" y2="485" stroke="#3B82F6" stroke-width="7"/>
        <polygon points="1429,485 1398,475 1398,495" fill="#3B82F6"/>
      </g>
    </g>

    <!-- Schritt-Marker: jede Nummer erscheint mit ihrem Schritt -->
    <g font-family="Helvetica,Arial,sans-serif" font-weight="800" font-size="34" text-anchor="middle">
      <g class="seq m1">
        <circle cx="540" cy="410" r="30" fill="#64748B" stroke="#FFFFFF" stroke-width="4"/>
        <text x="540" y="422" fill="#FFFFFF">1</text>
      </g>
      <g class="seq m2">
        <circle cx="540" cy="600" r="30" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="4"/>
        <text x="540" y="612" fill="#FFFFFF">2</text>
      </g>
      <g class="seq m3">
        <circle cx="700" cy="635" r="30" fill="#3B82F6" stroke="#FFFFFF" stroke-width="4"/>
        <text x="700" y="647" fill="#FFFFFF">3</text>
      </g>
      <g class="seq m4">
        <circle cx="1215" cy="636" r="30" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="4"/>
        <text x="1215" y="648" fill="#FFFFFF">4</text>
      </g>
      <g class="seq m5">
        <circle cx="1560" cy="615" r="30" fill="#DC2626" stroke="#FFFFFF" stroke-width="4"/>
        <text x="1560" y="627" fill="#FFFFFF">5</text>
      </g>
    </g>
    <g class="seq gLabel">
      <text x="1700" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
            font-size="30" font-weight="700" fill="#64748B">des centaines de km plus loin</text>
    </g>

  </g>
</svg>
