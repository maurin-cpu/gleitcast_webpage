<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Diagramme en barres : part des heures critiques par bande d'altitude. La règle des pilotes tombe de 20,26 % sous 800 m à 2,42 % au-dessus de 2500 m ; le critère scientifique monte en sens inverse de 0,12 à 13,43 %.">
