  Dependency issue: "I end up calling my instructor" - wants independence but
  doesn't trust themselves. Feels like a burden ("annoying him").

  Social anxiety: "I don't want to be the guy who crashes" - peer pressure,
  reputation concerns, fear of being judged as incompetent.

  Product implications:
  - Beginner mode is ESSENTIAL, not optional
  - Plain language (explain what CAPE is, don't just show the number)
  - Skill-level appropriate recommendations ("Safe for beginners today" vs "Only for experienced pilots")
  - Educational tooltips on every technical term
  - Confidence-building features (show them they're making good decisions)
  - "Ask your instructor" feature (share the recommendation, get validation)
  - Progress tracking (show improvement over time)

